<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAILY CORE Bridge</title>
</head>
<body>
<script>
(() => {
  'use strict';

  const ALLOWED_ORIGINS = new Set([
    'https://morigu812-svg.github.io',
    'https://daily-core.onrender.com'
  ]);
  const ALLOWED_METHODS = new Set([
    'getDashboardData',
    'saveTask',
    'deleteTask',
    'saveDailyStartTime'
  ]);

  function send(target, message, targetOrigin) {
    // GAS HtmlService は内部フレームを挟む場合がある。
    // event.source と top の両方へ返し、実際に親ページへ届く経路を確保する。
    // 同じ応答が二重に届いても、親ページ側は pending ID で一度だけ処理する。
    const targets = [target, window.top];
    const sent = new Set();
    targets.forEach(destination => {
      if (!destination || sent.has(destination) || typeof destination.postMessage !== 'function') return;
      sent.add(destination);
      try {
        destination.postMessage(message, targetOrigin);
      } catch (error) {
        // もう一方の宛先への送信を続ける。
      }
    });
  }

  window.addEventListener('message', event => {
    if (!ALLOWED_ORIGINS.has(event.origin)) return;
    // GAS HtmlService が内部フレームを挟むことがあるため、event.source の比較では拒否しない。
    // ALLOWED_ORIGIN とリクエスト形式・許可メソッドを検証して受け付ける。
    if (!event.source || typeof event.source.postMessage !== 'function') return;

    const request = event.data;
    if (!request || request.type !== 'DAILY_CORE_REQUEST') return;

    const { id, method, args } = request;
    if (typeof id !== 'string' || !ALLOWED_METHODS.has(method) || !Array.isArray(args)) {
      send(event.source, {
        type: 'DAILY_CORE_RESPONSE',
        id,
        ok: false,
        error: '不正なリクエストです。'
      }, event.origin);
      return;
    }

    try {
      const runner = google.script.run
        .withSuccessHandler(result => send(event.source, {
          type: 'DAILY_CORE_RESPONSE',
          id,
          ok: true,
          result
        }, event.origin))
        .withFailureHandler(error => send(event.source, {
          type: 'DAILY_CORE_RESPONSE',
          id,
          ok: false,
          error: error && error.message ? error.message : String(error)
        }, event.origin));

      runner[method](...args);
    } catch (error) {
      send(event.source, {
        type: 'DAILY_CORE_RESPONSE',
        id,
        ok: false,
        error: error && error.message ? error.message : String(error)
      }, event.origin);
    }
  });

  // 親ページがリスナーを登録するタイミングに左右されないよう、準備完了通知を数回送る。
  // タスクデータやスプレッドシートには触れない。
  function announceReady() {
    try {
      ALLOWED_ORIGINS.forEach(origin => {
        window.top.postMessage({ type: 'DAILY_CORE_BRIDGE_READY' }, origin);
      });
    } catch (error) {
      // 通知の失敗は次の通知で再試行する。
    }
  }

  window.addEventListener('DOMContentLoaded', announceReady, { once: true });
  window.addEventListener('load', announceReady, { once: true });
  announceReady();
  let readyAttempts = 0;
  const readyTimer = window.setInterval(() => {
    announceReady();
    readyAttempts += 1;
    if (readyAttempts >= 10) window.clearInterval(readyTimer);
  }, 500);
})();
</script>
</body>
</html>
