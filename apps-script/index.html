<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>DAILY CORE — タスク画面</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111a27;--line:#28384c;--text:#eef5ff;--muted:#91a2b8;--cyan:#52e5ff;--green:#56e6a5;--red:#ff718b;--purple:#9a86ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 5% 0%,#17354b 0,transparent 35%),radial-gradient(ellipse at 95% 5%,#261c49 0,transparent 32%),var(--bg);color:var(--text);font:14px Inter,"Yu Gothic UI",Meiryo,sans-serif}main{max-width:1100px;margin:auto;padding:26px 18px 60px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{letter-spacing:3px;font-weight:900;font-size:18px}.muted,small{color:var(--muted)}h1{font-size:clamp(25px,5vw,36px);margin:25px 0 8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.panel,.stat{background:#111a27e8;border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}.num{font-size:26px;font-weight:800;margin-top:7px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}.tasks{display:grid;gap:10px;margin-top:14px}.task{border:1px solid var(--line);background:#0b121d;border-radius:12px;padding:14px}.taskhead{display:flex;gap:10px;align-items:flex-start;min-width:0}.taskhead>input[type=checkbox]{width:18px;min-width:18px;flex:0 0 18px;margin:3px 0 0;padding:0;accent-color:var(--cyan)}.tasktitle{font-weight:750;flex:1;min-width:0;overflow-wrap:anywhere;word-break:normal}.done{text-decoration:line-through;color:var(--muted)}.tags,.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid #34475e;border-radius:99px;padding:3px 8px;font-size:11px;color:#b9c9de}.high{color:var(--red);border-color:#6b3446}.medium{color:#ffd27a}.low{color:var(--green)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #3b5870;border-radius:9px;background:#142538;color:var(--text);padding:9px 12px}button.primary{background:#12384a;border-color:#26748b;color:var(--cyan)}button.danger{color:var(--red)}input,textarea,select{width:100%;background:#080e17;border:1px solid #314157;border-radius:8px;padding:10px;color:var(--text)}label{display:block;color:#c5d2e4;font-size:12px;margin:12px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.status{margin-top:12px;min-height:20px;color:var(--muted);overflow-wrap:anywhere}.status.error{color:var(--red)}.status.success{color:var(--green)}.bar{height:6px;background:#273348;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple))}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #314157;border-radius:12px}hr{border:0;border-top:1px solid var(--line);margin:20px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.stat{padding:12px}.num{font-size:21px}}@media(max-width:430px){.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}.cal-head,.cal-day{min-width:0;text-align:center;padding:7px 0;font-size:12px}.cal-head{color:var(--muted)}.cal-day{border:1px solid transparent;background:transparent;padding:9px 0}.cal-day.has-tasks{border-color:#2e6578;color:var(--cyan)}.cal-day.selected{background:#12384a;border-color:var(--cyan);color:var(--text)}.cal-day.outside{opacity:.25}.longtasks-section{margin-top:26px;padding-top:22px;border-top:2px solid var(--line)}.longtasks-section>.muted{line-height:1.5}.dialog[hidden]{display:none}.dialog{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}.dialog-backdrop{position:absolute;inset:0;background:#02050bd9;backdrop-filter:blur(5px)}.dialog-card{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0009}.dialog-card form{margin-top:8px}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.shimmer{position:relative;overflow:hidden;background:linear-gradient(100deg,#111a27 25%,#26384d 38%,#111a27 55%);background-size:200% 100%;animation:shimmer 1.45s ease-in-out infinite;border:1px solid #28384c;border-radius:12px}
.shimmer-line{height:12px;border-radius:99px;margin:10px 0;background:linear-gradient(100deg,#172232 25%,#34475e 38%,#172232 55%);background-size:200% 100%;animation:shimmer 1.45s ease-in-out infinite}
.shimmer-line.short{width:38%}.shimmer-line.medium{width:65%}.shimmer-task{padding:16px;min-height:112px}
.shimmer-tag{display:inline-block;width:90px;height:22px;border-radius:99px;margin:8px 6px 0 0;background:linear-gradient(100deg,#172232 25%,#34475e 38%,#172232 55%);background-size:200% 100%;animation:shimmer 1.45s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.shimmer,.shimmer-line,.shimmer-tag{animation:none;background:#1b293b}}
</style></head><body><main>
<header class="top"><div><div class="brand">◈ DAILY CORE</div><div class="muted" style="font-size:11px;letter-spacing:2px;margin-top:5px">PERSONAL TASK SYSTEM</div></div><div class="row"><span class="muted" id="connection">接続確認中…</span><button id="reload">再読み込み</button></div></header>
<h1>タスク管理</h1><div class="muted">期限・重要度・所要時間をまとめて管理する。</div>
<section class="stats"><div class="stat"><small>未完了タスク</small><div class="num" id="remaining">—</div></div><div class="stat"><small>完了率（所要時間ベース）</small><div class="num" id="rate">—</div><div class="bar"><span id="progress"></span></div></div><div class="stat"><small>未完了の推定時間</small><div class="num" id="minutes">—</div></div></section>
<div class="layout"><section class="panel"><div class="row"><div><strong>タスクリスト</strong><div class="muted" style="font-size:12px;margin-top:5px">選択した日付のタスクを表示</div></div><button class="primary" id="add">＋ タスク追加</button></div><label for="day">表示日</label><div class="row"><input type="date" id="day" style="max-width:210px"><button id="today">今日</button></div><div id="tasks" class="tasks"><div class="empty">タスクを読み込み中…</div></div><div id="status" class="status" role="status"></div></section>
<aside class="panel"><div class="row"><button id="prevMonth" aria-label="前の月">‹</button><strong id="calendarTitle">カレンダー</strong><button id="nextMonth" aria-label="次の月">›</button></div><div id="calendar" class="calendar"></div><div class="muted" style="font-size:11px;margin-top:12px">日付を選ぶと、その日のタスクを表示します。</div><section class="longtasks-section"><strong>ロングタスク一覧</strong><div class="muted" style="font-size:11px;margin-top:5px">選択した日が期間内のロングタスク</div><div id="longTasks" class="tasks"><div class="empty">ロングタスクを読み込み中…</div></div></section></aside>
<div id="taskDialog" class="dialog" hidden><div class="dialog-backdrop" data-close-dialog></div><section class="dialog-card panel" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="row"><strong id="formTitle">タスクを追加</strong><button type="button" id="closeDialog" aria-label="閉じる">✕</button></div><form id="form"><input type="hidden" id="id"><label for="date">開始日</label><input id="date" type="date" required><label for="title">タスク名</label><input id="title" maxlength="180" required placeholder="例：数学の問題集"><div class="formgrid"><div><label for="due">期限日</label><input id="due" type="date" required></div><div><label for="duration">推定時間（分）</label><input id="duration" type="number" min="0" step="1" value="30" required></div><div class="wide"><label for="importance">重要度</label><select id="importance"><option value="3">高</option><option value="2" selected>中</option><option value="1">低</option></select></div><div class="wide"><label class="check"><input id="long" type="checkbox"> ロングタスク（複数日にまたがる）</label></div><div class="wide"><label for="memo">メモ</label><textarea id="memo" rows="3" placeholder="補足や手順など"></textarea></div></div><div class="actions"><button class="primary" type="submit">保存</button><button type="button" id="cancel">クリア</button></div></form></section></div></div></main>
<script>
const $=id=>document.getElementById(id);
function todayString(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const state={tasks:[],selectedDate:todayString(),busy:false,calendarMonth:todayString().slice(0,7),monthTasks:{}};
function call(method,...args){return new Promise((resolve,reject)=>{if(typeof google==='undefined'||!google.script||!google.script.run){reject(new Error('この画面はGoogle Apps Script内で開く必要があります'));return}google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))))[method](...args)})}
function status(msg,type){$('status').textContent=msg;$('status').className='status '+(type||'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mins(n){n=Number(n)||0;return n>=60?Math.floor(n/60)+'時間'+(n%60?' '+n%60+'分':''):n+'分'}
function importance(n){return Number(n)===3?'高':Number(n)===1?'低':'中'}
function loadingSkeleton(){return `<div class="shimmer shimmer-task"><div class="shimmer-line medium"></div><div><span class="shimmer-tag"></span><span class="shimmer-tag" style="width:70px"></span><span class="shimmer-tag" style="width:130px"></span></div></div><div class="shimmer shimmer-task"><div class="shimmer-line short"></div><div><span class="shimmer-tag"></span><span class="shimmer-tag" style="width:120px"></span></div></div>`}
async function load(){if(state.busy)return;state.busy=true;state.selectedDate=$('day').value;$('connection').textContent='同期中…';$('tasks').innerHTML=loadingSkeleton();try{const d=await call('getDashboardData',state.selectedDate);state.tasks=Array.isArray(d.tasks)?d.tasks:[];state.monthTasks=d.monthTasks||{};state.calendarMonth=state.selectedDate.slice(0,7);render(d);renderCalendar();$('connection').textContent='同期済み';status('')}catch(e){$('connection').textContent='接続エラー';$('tasks').innerHTML='<div class="empty">読み込みに失敗しました。GASの公開設定とデプロイを確認してください。</div>';status(e.message,'error')}finally{state.busy=false}}
function renderCalendar(){const [y,m]=state.calendarMonth.split('-').map(Number);$('calendarTitle').textContent=y+'年'+m+'月';const first=new Date(y,m-1,1),start=first.getDay(),days=new Date(y,m,0).getDate();const labels=['日','月','火','水','木','金','土'];let html=labels.map(x=>'<div class="cal-head">'+x+'</div>').join('');for(let i=0;i<start;i++)html+='<div class="cal-day outside"></div>';for(let day=1;day<=days;day++){const date=state.calendarMonth+'-'+String(day).padStart(2,'0');const tasks=state.monthTasks[date]||[];html+='<button type="button" class="cal-day '+(date===state.selectedDate?'selected ':'')+(tasks.length?'has-tasks':'')+'" data-calendar-date="'+date+'">'+day+(tasks.length?'<span style="display:block;font-size:9px">●</span>':'')+'</button>'} $('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-calendar-date]').forEach(b=>b.addEventListener('click',()=>{$('day').value=b.dataset.calendarDate;state.selectedDate=b.dataset.calendarDate;load()}))}
function renderTaskList(targetId,tasks,emptyMessage){
  const sorted=[...tasks].sort((a,b)=>(Number(b.importance)||2)-(Number(a.importance)||2)||(a.dueDate||'').localeCompare(b.dueDate||''));
  const container=$(targetId);
  if(!sorted.length){container.innerHTML='<div class="empty">'+emptyMessage+'</div>';return}
  container.innerHTML=sorted.map(t=>{
    const imp=Number(t.importance)||2;
    return '<article class="task"><div class="taskhead"><input type="checkbox" data-done="'+esc(t.id)+'" '+(t.completed?'checked':'')+' aria-label="完了"><div class="tasktitle '+(t.completed?'done':'')+'">'+esc(t.title)+'</div></div><div class="tags"><span class="tag '+(imp===3?'high':imp===1?'low':'medium')+'">重要度：'+importance(imp)+'</span><span class="tag">期間：'+esc(t.date||state.selectedDate)+'〜'+esc(t.dueDate||t.date||state.selectedDate)+'</span><span class="tag">'+mins(t.duration)+'</span>'+(t.longTask?'<span class="tag">ロングタスク</span>':'')+'</div>'+(t.memo?'<div class="muted" style="margin-top:9px;white-space:pre-wrap">'+esc(t.memo)+'</div>':'')+'<div class="actions"><button data-edit="'+esc(t.id)+'">編集</button><button class="danger" data-delete="'+esc(t.id)+'">削除</button></div></article>'
  }).join('');
  container.querySelectorAll('[data-done]').forEach(el=>el.addEventListener('change',()=>toggle(el.dataset.done,el.checked)));
  container.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>edit(el.dataset.edit)));
  container.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>removeTask(el.dataset.delete)));
}
function render(d){
  const all=state.tasks,regular=all.filter(t=>!t.longTask),pending=regular.filter(t=>!t.completed),total=regular.reduce((s,t)=>s+(Number(t.duration)||0),0),done=regular.reduce((s,t)=>s+(t.completed?(Number(t.duration)||0):0),0),pendingM=pending.filter(t=>(t.dueDate||t.date)===state.selectedDate).reduce((s,t)=>s+(Number(t.duration)||0),0),rate=total?Math.round(done/total*100):0;
  $('remaining').textContent=pending.length;$('rate').textContent=rate+'%';$('minutes').textContent=mins(pendingM);$('progress').style.width=rate+'%';
  renderTaskList('tasks',all.filter(t=>!t.longTask||(state.selectedDate===(t.dueDate||t.date))),'この日付のタスクはありません。追加してみよう。');
  renderTaskList('longTasks',all.filter(t=>t.longTask&&state.selectedDate>=(t.date||t.dueDate)&&state.selectedDate<=(t.dueDate||t.date)),'この日付はロングタスクの期間外です。');
}
function clearForm(){$('form').reset();$('id').value='';$('date').value=state.selectedDate;$('due').value=state.selectedDate;$('duration').value=30;$('importance').value=2;$('formTitle').textContent='タスクを追加'}
function edit(id){const t=state.tasks.find(t=>String(t.id)===String(id));if(!t)return;$('id').value=t.id;$('date').value=t.date||state.selectedDate;$('due').value=t.dueDate||t.date||state.selectedDate;$('title').value=t.title||'';$('duration').value=Number(t.duration)||0;$('importance').value=Number(t.importance)||2;$('long').checked=!!t.longTask;$('memo').value=t.memo||'';$('formTitle').textContent='タスクを編集';$('taskDialog').hidden=false;$('title').focus();}
async function saveTask(input){state.busy=true;try{const d=await call('saveTask',input,state.selectedDate);state.tasks=Array.isArray(d.tasks)?d.tasks:[];state.monthTasks=d.monthTasks||state.monthTasks;state.calendarMonth=state.selectedDate.slice(0,7);$('day').value=state.selectedDate;render(d);renderCalendar();status('保存しました','success');clearForm();$('taskDialog').hidden=true}catch(e){status('保存に失敗：'+e.message,'error')}finally{state.busy=false}}
async function toggle(id,checked){const t=state.tasks.find(t=>String(t.id)===String(id));if(t)await saveTask({...t,completed:checked})}
async function removeTask(id){const t=state.tasks.find(t=>String(t.id)===String(id));if(!t||!confirm('「'+t.title+'」を削除しますか？'))return;state.busy=true;try{const d=await call('deleteTask',id,state.selectedDate);state.tasks=Array.isArray(d.tasks)?d.tasks:[];state.monthTasks=d.monthTasks||state.monthTasks;state.calendarMonth=state.selectedDate.slice(0,7);$('day').value=state.selectedDate;render(d);renderCalendar();status('削除しました','success')}catch(e){status('削除に失敗：'+e.message,'error')}finally{state.busy=false}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const duration=Number($('duration').value);if(!Number.isInteger(duration)||duration<0){status('推定時間は0以上の整数で入力してください','error');return}const old=state.tasks.find(t=>String(t.id)===String($('id').value));const input={id:$('id').value||undefined,date:$('date').value,title:$('title').value.trim(),dueDate:$('due').value,duration,memo:$('memo').value,longTask:$('long').checked,importance:Number($('importance').value),completed:old?!!old.completed:false};if(!input.title){status('タスク名を入力してください','error');return}await saveTask(input)});
$('add').addEventListener('click',()=>{clearForm();$('taskDialog').hidden=false;$('title').focus()});$('closeDialog').addEventListener('click',()=>$('taskDialog').hidden=true);$('taskDialog').querySelector('[data-close-dialog]').addEventListener('click',()=>$('taskDialog').hidden=true);$('prevMonth').addEventListener('click',()=>{const [y,m]=state.calendarMonth.split('-').map(Number);const d=new Date(y,m-2,1);state.calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderCalendar()});$('nextMonth').addEventListener('click',()=>{const [y,m]=state.calendarMonth.split('-').map(Number);const d=new Date(y,m,1);state.calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderCalendar()});$('cancel').addEventListener('click',()=>{clearForm();$('taskDialog').hidden=true});$('reload').addEventListener('click',load);$('today').addEventListener('click',()=>{$('day').value=todayString();$('date').value=todayString();$('due').value=todayString();load()});$('day').addEventListener('change',()=>{state.selectedDate=$('day').value;$('date').value=state.selectedDate;$('due').value=state.selectedDate;load()});
$('day').value=state.selectedDate;clearForm();load();
</script></body></html>
