<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111a27;--line:#28384c;--text:#eef5ff;--muted:#91a2b8;--cyan:#52e5ff;--green:#56e6a5;--red:#ff718b;--purple:#9a86ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 55% 420px at 5% 0%,#17354b 0,transparent 100%) no-repeat,radial-gradient(ellipse 55% 420px at 95% 5%,#261c49 0,transparent 100%) no-repeat,var(--bg);color:var(--text);font:14px Inter,"Yu Gothic UI",Meiryo,sans-serif}main{max-width:1100px;margin:auto;padding:26px 18px 60px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{letter-spacing:3px;font-weight:900;font-size:18px}.muted,small{color:var(--muted)}h1{font-size:clamp(25px,5vw,36px);margin:25px 0 8px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.panel,.stat{background:#111a27e8;border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}.num{font-size:26px;font-weight:800;margin-top:7px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}.left-panels{display:grid;gap:14px;min-width:0}.calendar-panel{grid-column:2;grid-row:1}.tasks{display:grid;gap:10px;margin-top:14px}.task{border:1px solid var(--line);background:#0b121d;border-radius:12px;padding:14px}.taskhead{display:flex;gap:10px;align-items:flex-start;min-width:0}.taskhead>input[type=checkbox]{width:18px;min-width:18px;flex:0 0 18px;margin:3px 0 0;padding:0;accent-color:var(--cyan)}.tasktitle{font-weight:750;flex:1;min-width:0;overflow-wrap:anywhere;word-break:normal}.done{text-decoration:line-through;color:var(--muted)}.tags,.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid #34475e;border-radius:99px;padding:3px 8px;font-size:11px;color:#b9c9de}.high{color:var(--red);border-color:#6b3446}.medium{color:#ffd27a}.low{color:var(--green)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #3b5870;border-radius:9px;background:#142538;color:var(--text);padding:9px 12px}button.primary{background:#12384a;border-color:#26748b;color:var(--cyan)}button.danger{color:var(--red)}input,textarea,select{width:100%;background:#080e17;border:1px solid #314157;border-radius:8px;padding:10px;color:var(--text)}label{display:block;color:#c5d2e4;font-size:12px;margin:12px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.status{margin-top:12px;min-height:20px;color:var(--muted);overflow-wrap:anywhere}.status.error{color:var(--red)}.status.success{color:var(--green)}.bar{height:6px;background:#273348;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple))}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #314157;border-radius:12px}hr{border:0;border-top:1px solid var(--line);margin:20px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.task-panel,.calendar-panel,.longtasks-panel{grid-column:1;grid-row:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.num{font-size:21px}}@media(max-width:430px){.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
.collapsible-panel>summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;font-weight:750}.collapsible-panel>summary::-webkit-details-marker{display:none}.collapsible-panel>summary::after{content:"＋";color:var(--cyan);font-size:16px;line-height:1}.collapsible-panel[open]>summary::after{content:"−"}.collapsible-panel[open]>summary{margin-bottom:14px}.panel-summary-note{margin-left:auto;color:var(--muted);font-size:11px;font-weight:400}.count-badge{display:inline-block;margin-left:4px;padding:2px 7px;border:1px solid #2e6578;border-radius:999px;background:#1b3142;color:var(--cyan);font-size:11px;font-weight:700;vertical-align:1px}.clock-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:11px}.clock-meta strong{color:var(--cyan);font-size:13px}.task-toolbar{justify-content:flex-end}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}.cal-head,.cal-day{min-width:0;text-align:center;padding:7px 0;font-size:12px}.cal-head{color:var(--muted)}.cal-day{border:1px solid transparent;background:transparent;padding:9px 0}.cal-day.has-tasks{border-color:#2e6578;color:var(--cyan)}.cal-day.selected{background:#12384a;border-color:var(--cyan);color:var(--text)}.cal-day.outside{opacity:.25}.cal-day.today{color:var(--cyan)}.today-dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin:3px auto 0}.longtasks-panel>.muted{line-height:1.5}.dialog[hidden]{display:none}.dialog{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}.dialog-backdrop{position:absolute;inset:0;background:#02050bd9;backdrop-filter:blur(5px)}.dialog-card{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0009}.dialog-card form{margin-top:8px}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.shimmer{position:relative;overflow:hidden;background:linear-gradient(100deg,#111a27 25%,#26384d 38%,#111a27 55%);background-size:200% 100%;animation:shimmer 1.45s ease-in-out infinite;border:1px solid #28384c;border-radius:12px}
.shimmer-line{height:12px;border-radius:99px;margin:10px 0;background:linear-gradient(100deg,#172232 25%,#34475e 38%,#172232 55%);background-size:200% 100%;animation:shimmer 1.45s ease-in-out infinite}
.shimmer-line.short{width:38%}.shimmer-line.medium{width:65%}.shimmer-task{padding:16px;min-height:112px}
.shimmer-tag{display:inline-block;width:90px;height:22px;border-radius:99px;margin:8px 6px 0 0;background:linear-gradient(100deg,#172232 25%,#34475e 38%,#172232 55%);background-size:200% 100%;animation:shimmer 1.45s ease-in-out infinite}.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status.loading::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spin .8s linear infinite}button:disabled{opacity:.7;cursor:wait}
@media(prefers-reduced-motion:reduce){.shimmer,.shimmer-line,.shimmer-tag{animation:none;background:#1b293b}}
.clock-settings{width:min(440px,calc(100% - 32px));color:var(--text)}.clock-settings::backdrop{background:#02050bd9}.clock-settings-button{margin-top:10px;padding:5px 8px;font-size:12px}</style></head><body>
<iframe id="gasBridge" title="GAS通信ブリッジ" src="https://script.google.com/macros/s/AKfycbyzDjKQJyiKrVh3lpoariDTu0eeJjX-JU2tir2jNbOfk5mDyEyJHz3iFawAXU7_YkXY/exec?mode=bridge&v=20261026c" style="position:absolute;width:1px;height:1px;left:-10000px;border:0" aria-hidden="true"></iframe><main>
<header class="top"><div><div class="brand">◈ DAILY CORE</div><div class="muted" style="font-size:11px;letter-spacing:2px;margin-top:5px">PERSONAL TASK SYSTEM</div></div><div class="row"><span class="muted" id="connection">接続確認中…</span><button id="reload">再読み込み</button></div></header>
<h1>タスク管理</h1><div class="muted">期限・重要度・所要時間をまとめて管理する。</div>
<section class="stats"><div class="stat"><small>未完了タスク</small><div class="num" id="remaining">—</div></div><div class="stat"><small>完了率（所要時間ベース）</small><div class="num" id="rate">—</div><div class="bar"><span id="progress"></span></div></div><div class="stat"><small>未完了の推定時間</small><div class="num" id="minutes">—</div></div><div class="stat clock-stat"><small>現在時刻</small><div class="num" id="clock">--:--</div><div class="clock-meta"><span id="dayProgressWindow"></span><strong id="dayProgressLabel">0%</strong></div><div class="bar"><span id="dayProgress"></span></div><button type="button" id="openClockSettings" class="clock-settings-button">計算時間を設定</button></div></section>
<div class="layout"><div class="left-panels"><details class="panel task-panel collapsible-panel" open><summary class="panel-summary"><span>タスクリスト <span id="taskCount" class="count-badge">0件</span></span><span class="panel-summary-note">選択した日付のタスクを表示</span></summary><div class="row task-toolbar"><button class="primary" id="add">＋ タスク追加</button></div><label for="day">表示日</label><div class="row"><input type="date" id="day" style="max-width:210px"><button id="today">今日</button></div><div id="tasks" class="tasks"><div class="empty">タスクを読み込み中…</div></div><div id="status" class="status" role="status"></div></details><details class="panel longtasks-panel collapsible-panel"><summary class="panel-summary"><span>ロングタスク一覧 <span id="longTaskCount" class="count-badge">0件</span></span><span class="panel-summary-note">選択した日が期間内のロングタスク</span></summary><div id="longTasks" class="tasks"><div class="empty">ロングタスクを読み込み中…</div></div></details></div><aside class="panel calendar-panel"><div class="row"><button id="prevMonth" aria-label="前の月">‹</button><strong id="calendarTitle">カレンダー</strong><button id="nextMonth" aria-label="次の月">›</button></div><div id="calendar" class="calendar"></div><div class="muted" style="font-size:11px;margin-top:12px">日付を選ぶと、その日のタスクを表示します。</div></aside><div id="taskDialog" class="dialog" hidden><div class="dialog-backdrop" data-close-dialog></div><section class="dialog-card panel" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="row"><strong id="formTitle">タスクを追加</strong><button type="button" id="closeDialog" aria-label="閉じる">✕</button></div><form id="form"><input type="hidden" id="id"><label for="date">開始日</label><input id="date" type="date" required><label for="title">タスク名</label><input id="title" maxlength="180" required placeholder="例：数学の問題集"><div class="formgrid"><div><label for="due">期限日</label><input id="due" type="date" required></div><div><label for="duration">推定時間（分）</label><input id="duration" type="number" min="0" step="1" value="30" required></div><div class="wide"><label for="importance">重要度</label><select id="importance"><option value="3">高</option><option value="2" selected>中</option><option value="1">低</option></select></div><div class="wide"><label class="check"><input id="long" type="checkbox"> ロングタスク（複数日にまたがる）</label></div><div class="wide"><label for="memo">メモ</label><textarea id="memo" rows="3" placeholder="補足や手順など"></textarea></div></div><div class="actions"><button class="primary" type="submit">保存</button><button type="button" id="cancel">クリア</button></div></form></section></div></div></main>
<dialog id="clockSettings" class="panel clock-settings" aria-labelledby="clockSettingsTitle">
  <div class="row"><strong id="clockSettingsTitle">日付ごとの計算時間</strong><button type="button" id="closeClockSettings">閉じる</button></div>
  <form id="clockSettingsForm">
    <label for="clockDate">対象日</label>
    <input type="date" id="clockDate" required>
    <div class="formgrid">
      <div><label for="clockStart">開始時刻</label><input id="clockStart" placeholder="7:30" required aria-describedby="clockTimeHint"></div>
      <div><label for="clockEnd">終了時刻</label><input id="clockEnd" placeholder="24:00" required aria-describedby="clockTimeHint"></div>
    </div>
    <p id="clockTimeHint" class="muted">24時間表記で入力してください。終了時刻には24:00も使えます。設定はこのブラウザに保存されます。</p>
    <div class="row"><button type="submit" class="primary">保存</button><button type="button" id="resetClockSettings">曜日の設定に戻す</button></div>
    <div id="clockSettingsStatus" class="status" role="status"></div>
  </form>
</dialog>
<script>
const $=id=>document.getElementById(id);
function todayString(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const clockStoragePrefix='daily-core.clock-window.';
function defaultClockWindow(date){
  const day=new Date(date+'T00:00:00').getDay();
  return day===0||day===6?[450,1440]:[1200,1380];
}
function validClockWindow(start,end){
  return Number.isInteger(start)&&Number.isInteger(end)&&start>=0&&start<end&&end<=1440;
}
function clockWindow(date){
  try{
    const saved=JSON.parse(localStorage.getItem(clockStoragePrefix+date));
    if(Array.isArray(saved)&&validClockWindow(...saved))return saved;
  }catch{
    // 日付別の設定を読み込めない場合は、曜日の設定を使う。
  }
  return defaultClockWindow(date);
}
function formatClockMinutes(minutes){
  return Math.floor(minutes/60)+':'+String(minutes%60).padStart(2,'0');
}
function parseClockMinutes(value){
  const match=/^(\d{1,2}):([0-5]\d)$/.exec(value.trim());
  return match?Number(match[1])*60+Number(match[2]):NaN;
}
function updateClock(){
  const now=new Date(),h=now.getHours(),m=now.getMinutes();
  const [start,end]=clockWindow(todayString(now));
  const minutes=h*60+m;
  const percent=Math.max(0,Math.min(100,(minutes-start)/(end-start)*100));
  $('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  $('dayProgressWindow').textContent=formatClockMinutes(start)+'〜'+formatClockMinutes(end)+'の経過';
  $('dayProgressLabel').textContent=Math.round(percent)+'%';
  $('dayProgress').style.width=percent+'%';
}
function loadClockSettings(){
  const date=$('clockDate').value;
  const [start,end]=date?clockWindow(date):[];
  $('clockStart').value=date?formatClockMinutes(start):'';
  $('clockEnd').value=date?formatClockMinutes(end):'';
  $('clockSettingsStatus').textContent='';
}
$('openClockSettings').addEventListener('click',()=>{
  $('clockDate').value=todayString();
  loadClockSettings();
  $('clockSettings').showModal();
});
$('closeClockSettings').addEventListener('click',()=>$('clockSettings').close());
$('clockDate').addEventListener('change',loadClockSettings);
$('clockSettingsForm').addEventListener('submit',event=>{
  event.preventDefault();
  const start=parseClockMinutes($('clockStart').value);
  const end=parseClockMinutes($('clockEnd').value);
  if(!validClockWindow(start,end)){
    $('clockSettingsStatus').textContent='開始時刻より後の終了時刻を入力してください（例 7:30〜24:00）。';
    return;
  }
  try{
    localStorage.setItem(clockStoragePrefix+$('clockDate').value,JSON.stringify([start,end]));
  }catch{
    $('clockSettingsStatus').textContent='設定を保存できませんでした。';
    return;
  }
  updateClock();
  $('clockSettingsStatus').textContent='この日付の設定を保存しました。';
});
$('resetClockSettings').addEventListener('click',()=>{
  const date=$('clockDate');
  if(!date.reportValidity())return;
  try{
    localStorage.removeItem(clockStoragePrefix+date.value);
  }catch{
    $('clockSettingsStatus').textContent='設定を解除できませんでした。';
    return;
  }
  loadClockSettings();
  updateClock();
  $('clockSettingsStatus').textContent='曜日の設定に戻しました。';
});
const state={tasks:[],selectedDate:todayString(),busy:false,calendarMonth:todayString().slice(0,7),monthTasks:{}};
const bridgeState={ready:false,waiters:[],pending:new Map(),nextId:0};
function call(method,...args){
  return new Promise((resolve,reject)=>{
    const id='req-'+Date.now()+'-'+(++bridgeState.nextId);
    let sent=false;
    const send=()=>{
      if(!bridgeState.pending.has(id))return;
      sent=postToGasBridge({type:'DAILY_CORE_REQUEST',id,method,args});
      if(!sent){
        clearTimeout(timer);
        bridgeState.pending.delete(id);
        reject(new Error('GASブリッジを開けませんでした。'));
      }
    };
    const timer=setTimeout(()=>{
      bridgeState.pending.delete(id);
      bridgeState.waiters=bridgeState.waiters.filter(waiter=>waiter!==send);
      const error=new Error(sent?'GASから40秒以内に応答がありません。':'GASブリッジに接続できませんでした。');
      error.uncertain=sent;
      reject(error);
    },40000);
    bridgeState.pending.set(id,{resolve,reject,timer});
    if(bridgeState.ready)send();else bridgeState.waiters.push(send);
  });
}
const bridgeFrame=document.getElementById('gasBridge');
let bridgeBootStarted=false;
let bridgeHandshakeTimer=null;

// GAS HtmlService may place the bridge in nested frames. Send the request to each
// frame in the bridge iframe so the user HTML frame receives it.
function postToGasBridge(message){
  const frame=document.getElementById('gasBridge');
  if(!frame||!frame.contentWindow)return false;
  const visited=new Set();
  function visit(target,depth){
    if(!target||depth>4||visited.has(target))return;
    visited.add(target);
    try{target.postMessage(message,'*')}catch(error){}
    let count=0;
    try{count=target.frames.length}catch(error){return}
    for(let i=0;i<count;i++){
      let child=null;
      try{child=target.frames[i]}catch(error){continue}
      visit(child,depth+1);
    }
  }
  visit(frame.contentWindow,0);
  return true;
}

// iframe の load はHTML読み込み完了を示すだけ。
// ブリッジから READY 通知を受信して初めて接続済みと判定する。
function onBridgeReady(){
  bridgeState.ready=true;
  bridgeState.waiters.splice(0).forEach(fn=>fn());
  if(!bridgeBootStarted){
    bridgeBootStarted=true;
    if(bridgeHandshakeTimer) clearTimeout(bridgeHandshakeTimer);
    load();
  }
}
window.addEventListener('message',event=>{const msg=event.data;if(!msg||typeof msg!=='object')return;const trustedBridgeOrigin=event.origin==='https://script.google.com'||event.origin.endsWith('.googleusercontent.com');if(!trustedBridgeOrigin)return;if(msg.type==='DAILY_CORE_BRIDGE_READY'){onBridgeReady();return}if(msg.type==='DAILY_CORE_RESPONSE'&&typeof msg.id==='string'){const p=bridgeState.pending.get(msg.id);if(!p)return;clearTimeout(p.timer);bridgeState.pending.delete(msg.id);if(msg.ok)p.resolve(msg.result);else p.reject(new Error(msg.error||'GASでエラーが発生しました'))}});
function status(msg,type){$('status').textContent=msg;$('status').className='status '+(type||'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mins(n){n=Number(n)||0;return n>=60?Math.floor(n/60)+'時間'+(n%60?' '+n%60+'分':''):n+'分'}
function importance(n){return Number(n)===3?'高':Number(n)===1?'低':'中'}
function loadingSkeleton(){return `<div class="shimmer shimmer-task"><div class="shimmer-line medium"></div><div><span class="shimmer-tag"></span><span class="shimmer-tag" style="width:70px"></span><span class="shimmer-tag" style="width:130px"></span></div></div><div class="shimmer shimmer-task"><div class="shimmer-line short"></div><div><span class="shimmer-tag"></span><span class="shimmer-tag" style="width:120px"></span></div></div>`}
let loadVersion=0, monthVersion=0, mutationVersion=0, draftId='';
async function load(message='',type='',snapshot){
  const date=$('day').value;
  if(!date)return;
  const version=++loadVersion, calendarRequest=++monthVersion;
  state.selectedDate=date;
  state.calendarMonth=date.slice(0,7);
  state.tasks=[];
  state.monthTasks={};
  renderCalendar();
  $('connection').textContent='同期中…';
  $('tasks').innerHTML=loadingSkeleton();
  $('longTasks').innerHTML=loadingSkeleton();
  for(const id of ['remaining','rate','minutes','taskCount','longTaskCount'])$(id).textContent='—';
  $('progress').style.width='0%';
  const started=performance.now();
  try{
    const data=snapshot?.selectedDate===date?snapshot:await call('getDashboardData',date,true);
    if(version!==loadVersion)return;
    if(data.selectedDate!==date)throw new Error('選択日と取得結果が一致しません。');
    const received=performance.now();
    state.tasks=Array.isArray(data.tasks)?data.tasks:[];
    state.safeMutations=data.safeMutations===true;
    render();
    if(calendarRequest===monthVersion){
      state.monthTasks=data.monthTasks||{};
      renderCalendar();
    }
    $('connection').textContent='同期済み';
    $('connection').title='取得 '+Math.round(received-started)+'ms / 描画 '+Math.round(performance.now()-received)+'ms';
    status([message,data.invalidRows?'読み込めなかった行が '+data.invalidRows+' 件あります。':''].filter(Boolean).join(' '),type||(data.invalidRows?'error':''));
  }catch(error){
    if(version!==loadVersion)return;
    $('connection').textContent='接続エラー';
    $('tasks').innerHTML='<div class="empty">読み込みに失敗しました。再読み込みしてください。</div>';
    $('longTasks').innerHTML='<div class="empty">ロングタスク一覧を読み込めませんでした。</div>';
    status([message,error.message].filter(Boolean).join(' '),'error');
  }
}
async function changeMonth(offset){
  const [year,month]=state.calendarMonth.split('-').map(Number);
  const target=todayString(new Date(year,month-1+offset,1)).slice(0,7);
  const version=++monthVersion, mutation=mutationVersion;
  state.calendarMonth=target;
  state.monthTasks={};
  renderCalendar();
  try{
    const data=await call('getDashboardData',target+'-01',true);
    if(version!==monthVersion||mutation!==mutationVersion)return;
    state.monthTasks=data.monthTasks||{};
    renderCalendar();
  }catch(error){
    if(version===monthVersion)status('月の予定を取得できませんでした。'+error.message,'error');
  }
}
function renderCalendar(){const [y,m]=state.calendarMonth.split('-').map(Number);$('calendarTitle').textContent=y+'年'+m+'月';const first=new Date(y,m-1,1),start=first.getDay(),days=new Date(y,m,0).getDate();const labels=['日','月','火','水','木','金','土'],today=todayString();let html=labels.map(x=>'<div class="cal-head">'+x+'</div>').join('');for(let i=0;i<start;i++)html+='<div class="cal-day outside"></div>';for(let day=1;day<=days;day++){const date=state.calendarMonth+'-'+String(day).padStart(2,'0');const tasks=state.monthTasks[date]||[],isToday=date===today;html+='<button type="button" class="cal-day '+(date===state.selectedDate?'selected ':'')+((Array.isArray(tasks)?tasks.length:tasks)?'has-tasks ':'')+(isToday?'today':'')+'" data-calendar-date="'+date+'">'+day+(isToday?'<span class="today-dot" aria-hidden="true"></span>':'')+'</button>'} $('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-calendar-date]').forEach(b=>b.addEventListener('click',()=>{$('day').value=b.dataset.calendarDate;load()}))}
function renderTaskList(targetId,tasks,emptyMessage){
  const sorted=[...tasks].sort((a,b)=>(Number(b.importance)||2)-(Number(a.importance)||2)||(a.dueDate||'').localeCompare(b.dueDate||''));
  const container=$(targetId);
  if(!sorted.length){container.innerHTML='<div class="empty">'+emptyMessage+'</div>';return}
  container.innerHTML=sorted.map(t=>{
    const imp=Number(t.importance)||2;
    return '<article class="task"><div class="taskhead"><input type="checkbox" data-done="'+esc(t.id)+'" '+(t.completed?'checked':'')+' aria-label="完了"><div class="tasktitle '+(t.completed?'done':'')+'">'+esc(t.title)+'</div></div><div class="tags"><span class="tag '+(imp===3?'high':imp===1?'low':'medium')+'">重要度：'+importance(imp)+'</span><span class="tag">期間：'+esc(t.date||state.selectedDate)+'〜'+esc(t.dueDate||t.date||state.selectedDate)+'</span><span class="tag">'+mins(t.duration)+'</span>'+(t.longTask?'<span class="tag">ロングタスク</span>':'')+'</div>'+(t.memo?'<div class="muted" style="margin-top:9px;white-space:pre-wrap">'+esc(t.memo)+'</div>':'')+'<div class="actions"><button data-edit="'+esc(t.id)+'">編集</button><button class="danger" data-delete="'+esc(t.id)+'">削除</button></div></article>'
  }).join('');
  container.querySelectorAll('[data-done]').forEach(el=>el.addEventListener('change',()=>toggle(el.dataset.done,el.checked)));
  container.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>edit(el.dataset.edit)));
  container.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>removeTask(el.dataset.delete)));
}
function render(){
  const all=state.tasks;
  const taskList=all.filter(t=>!t.longTask||(state.selectedDate===(t.dueDate||t.date)));
  const longTaskList=all.filter(t=>t.longTask&&state.selectedDate>=(t.date||t.dueDate)&&state.selectedDate<=(t.dueDate||t.date));
  const sum=list=>list.reduce((s,t)=>s+(Number(t.duration)||0),0);
  const progressTasks=taskList;
  const total=sum(progressTasks),done=sum(progressTasks.filter(t=>t.completed)),pendingM=total-done,rate=total?Math.round(done/total*100):taskList.length?Math.round(taskList.filter(t=>t.completed).length/taskList.length*100):0;
  $('remaining').textContent=taskList.filter(t=>!t.completed).length;$('taskCount').textContent=taskList.length+'件';$('longTaskCount').textContent=longTaskList.length+'件';
  $('rate').textContent=rate+'%';$('minutes').textContent=mins(pendingM);$('progress').style.width=rate+'%';
  renderTaskList('tasks',taskList,'この日付のタスクはありません。追加してみよう。');
  renderTaskList('longTasks',longTaskList,'この日付はロングタスクの期間外です。');
  }
function clearForm(){draftId='';$('form').reset();$('id').value='';$('date').value=state.selectedDate;$('due').value=state.selectedDate;$('duration').value=30;$('importance').value=2;$('formTitle').textContent='タスクを追加'}
function edit(id){if(state.busy)return;const t=state.tasks.find(t=>String(t.id)===String(id));if(!t)return;$('id').value=t.id;$('id').dataset.version=t.updatedAt||'';$('date').value=t.date||state.selectedDate;$('due').value=t.dueDate||t.date||state.selectedDate;$('title').value=t.title||'';$('duration').value=Number(t.duration)||0;$('importance').value=Number(t.importance)||2;$('long').checked=!!t.longTask;$('memo').value=t.memo||'';$('formTitle').textContent='タスクを編集';$('taskDialog').hidden=false;$('title').focus()}
async function mutate(method,input,success,closeForm=false){
  if(state.busy)return;
  const submit=$('form').querySelector('button[type="submit"]');
  const date=state.selectedDate;
  state.busy=true;
  ++mutationVersion;
  submit.disabled=true;
  status('更新中…','loading');
  try{
    const result=await call(method,input,date);
    if(closeForm){
      clearForm();
      $('taskDialog').hidden=true;
    }
    await load(success,'success',result);
  }catch(error){
    const message=error.uncertain?'応答が途切れました。一覧で結果を確認してください。同じ追加を再試行しても同じIDを使います。':'更新を確認できませんでした。'+error.message;
    await load(message,'error');
  }finally{
    state.busy=false;
    submit.disabled=false;
  }
}
function toggle(id,checked){
  const task=state.tasks.find(t=>String(t.id)===String(id));
  if(!task)return;
  for(const box of document.querySelectorAll('[data-done]')){
    if(box.dataset.done===id)box.checked=task.completed;
  }
  const payload=state.safeMutations?{id,completed:checked,operation:'toggle'}:{...task,completed:checked};
  return mutate('saveTask',payload,'完了状態を更新しました');
}
function removeTask(id){
  if(state.busy)return;
  const task=state.tasks.find(t=>String(t.id)===String(id));
  if(task&&confirm('「'+task.title+'」を削除しますか？')){
    return mutate('deleteTask',state.safeMutations?{id}:id,'削除しました');
  }
}
